[package]
name = "metropolix-contract"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
near-workspaces = "=0.24.0"
tokio = { version = "=1.52.3", features = ["full"] }
proptest = "1.12.0"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
strip = true
panic = "abort"
