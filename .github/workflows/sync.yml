# Keeps the indexer fresh: every 5 minutes ask the deployed game to pull the contract's views into its DB.
name: chain-sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/chain/sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ]; then echo "SYNC_URL not set"; exit 0; fi
          curl -fsS -X POST "$SYNC_URL/api/chain/sync" -H "Authorization: Bearer $SYNC_SECRET" --max-time 120
